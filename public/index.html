<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusHub Learning</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0F17;
            --card-bg: #161B26;
            --card-hover: #1F2636;
            --accent-blue: #0088FF;
            --accent-glow: rgba(0, 136, 255, 0.25);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border-color: #262D3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header & Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38BDF8, #0088FF);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #FFF;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Search & Controls Section */
        .search-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .search-input {
            flex: 1;
            background: #0F131C;
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            color: #FFF;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .search-btn {
            background: var(--accent-blue);
            color: #FFF;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .search-btn:hover {
            box-shadow: 0 0 16px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* Filters Row */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .duration-select {
            background: #0F131C;
            color: #FFF;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        /* Preset Quick Pills */
        .preset-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .pill {
            background: #0F131C;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill:hover {
            border-color: var(--accent-blue);
            color: var(--text-main);
        }

        /* Video Feed Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: #3B82F6;
        }

        .thumb-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
        }

        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bookmark-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(11, 15, 23, 0.8);
            border: 1px solid var(--border-color);
            color: #FFF;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            font-size: 0.875rem;
            transition: background 0.2s;
            z-index: 10;
        }

        .bookmark-btn.saved {
            background: #EF4444;
            border-color: #EF4444;
        }

        .video-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            flex: 1;
            background: #0F131C;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--border-color);
        }

        /* Summary Modal Drawer */
        .summary-box {
            background: #0F131C;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
            display: none;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
        }

        /* Next Topics Drawer */
        .next-topics {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            display: none;
        }

        .next-topics h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .topic-pills {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        /* Video Player Overlay Modal */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .player-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1010;
            background: rgba(15, 19, 28, 0.9);
            border: 1px solid var(--border-color);
            color: #FFF;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Mobile Responsive Styles --- */
        @media (max-width: 768px) {

            /* Stack the video player and notes vertically on mobile */
            #playerModal>div>div[style*="display: flex"] {
                flex-direction: column !important;
                overflow-y: auto;
            }

            /* Adjust video frame for mobile screens */
            #playerModal iframe {
                min-height: 250px !important;
                height: 30vh !important;
            }

            /* Make the notes panel take the remaining space */
            #liveNoteInput {
                min-height: 40vh !important;
            }

            /* Adjust navigation tabs to fit small screens */
            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem;
            }

            .tab-btn {
                font-size: 0.85rem;
                padding: 0.5rem 0.8rem;
                flex: 1 1 auto;
                text-align: center;
            }

            /* Adjust main container padding */
            .container {
                padding: 10px !important;
            }

            /* Adjust the search box layout for mobile */
            #searchBoxSection>div {
                flex-direction: column !important;
                align-items: stretch !important;
            }

            #searchBoxSection button,
            #searchBoxSection input {
                width: 100%;
                margin-top: 5px;
            }
        }
    </style>

    <script>

        // ---------- Focus Timer ----------
        let timerTotalSeconds = 25 * 60;
        let timerRemainingSeconds = timerTotalSeconds;
        let timerInterval = null;
        let timerRunning = false;

        function formatTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            const display = document.getElementById('minimizedTimerDisplay');
            if (display) display.textContent = formatTimerDisplay(timerRemainingSeconds);
        }

        function setTimer(minutes) {
            pauseTimerInternal();
            timerTotalSeconds = minutes * 60;
            timerRemainingSeconds = timerTotalSeconds;
            updateTimerDisplay();
        }

        function toggleTimer() {
            if (timerRunning) {
                pauseTimerInternal();
            } else {
                startTimerInternal();
            }
        }

        function startTimerInternal() {
            if (timerRunning) return;
            timerRunning = true;
            const btn = document.getElementById('startPauseBtn');
            if (btn) btn.textContent = 'Pause';

            timerInterval = setInterval(() => {
                if (timerRemainingSeconds <= 0) {
                    pauseTimerInternal();
                    alert('Time\'s up!');
                    return;
                }
                timerRemainingSeconds--;
                updateTimerDisplay();
            }, 1000);
        }

        function pauseTimerInternal() {
            timerRunning = false;
            clearInterval(timerInterval);
            const btn = document.getElementById('startPauseBtn');
            if (btn) btn.textContent = 'Start';
        }

        function resetTimer() {
            pauseTimerInternal();
            timerRemainingSeconds = timerTotalSeconds;
            updateTimerDisplay();
        }
        let currentSearchResults = [];

        // Preset topic buttons (Design, Gaming, Coding, Science)
        function handlePresetClick(topic) {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.value = topic;
            }
            executeSearch();
        }

        // Runs a search against the backend, with academic filtering baked in
        async function executeSearch() {
            const searchInput = document.getElementById('searchInput');
            const durationFilter = document.getElementById('durationFilter');

            let rawQuery = searchInput ? searchInput.value.trim() : '';
            if (!rawQuery) return;

            let fetchQuery = `${rawQuery} lecture OR tutorial -kids -children -toddler -toy -nursery -ryan -"rock n learn"`;

            const duration = durationFilter ? durationFilter.value : 'any';

            const videoGrid = document.getElementById('videoGrid');
            if (videoGrid) {
                videoGrid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">Searching for academic videos...</p>';
            }

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(fetchQuery)}&duration=${duration}`);
                const data = await response.json();
                currentSearchResults = data || [];
                renderVideos(currentSearchResults, videoGrid, 'No suitable academic videos found.');
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        // Renders a list of videos as cards into the given container
        // Renders a list of videos as cards into the given container
        function renderVideos(videos, container, emptyMessage = 'No videos found.') {
            if (!container) return;
            container.innerHTML = '';

            if (!videos || videos.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">${emptyMessage}</p>`;
                return;
            }

            videos.forEach((video) => {
                const actualId = typeof video.id === 'object' ? (video.id.videoId || '') : (video.id || '');
                if (!actualId) return;

                // Check if this video is already saved, so the button shows the right state
                const savedList = JSON.parse(localStorage.getItem('savedVideos') || '[]');
                const isSaved = savedList.some(v => {
                    const vId = typeof v.id === 'object' ? (v.id.videoId || v.id.id) : v.id;
                    return vId === actualId;
                });

                // Pre-compute the button's look so the template literal below stays simple
                const saveBtnBg = isSaved ? '#0088FF' : 'var(--bg-dark)';
                const saveBtnColor = isSaved ? '#fff' : 'var(--text-main)';
                const saveBtnText = isSaved ? 'Saved' : 'Save';

                const card = document.createElement('div');
                card.style.cssText = 'background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;';

                card.innerHTML = `
    <div style="position: relative; cursor: pointer;" onclick="openVideoModal('${actualId}')">
      <img src="${video.thumbnail || ''}" alt="Thumbnail" style="width: 100%; aspect-ratio: 16/9; object-fit: cover;" />
      <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0'">
        <span style="background: var(--accent-primary, #007bff); color: white; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem;">Watch & Take Notes</span>
      </div>
    </div>
    <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: space-between;">
      <h4 style="font-size: 0.9rem; color: var(--text-main); margin: 0; line-height: 1.4; cursor: pointer;" onclick="openVideoModal('${actualId}')">${video.title || 'Educational Video'}</h4>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.75rem; color: var(--text-muted);">${video.channelTitle || ''}</span>
        <div style="display: flex; gap: 6px;">
          <button onclick="openVideoModal('${actualId}')" style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;">Watch</button>
          <button data-save-id="${actualId}" onclick="saveVideo('${actualId}')" style="background: ${saveBtnBg}; border: 1px solid var(--border-color); color: ${saveBtnColor}; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;">${saveBtnText}</button>
        </div>
      </div>
    </div>
  `;
                container.appendChild(card);
            });
        }

        // Opens the player modal and loads the given video into the real iframe (#youtubeIframe)
        function openVideoModal(videoId) {
            console.log("RAW VIDEO ID RECEIVED:", videoId);

            let idString = '';
            if (typeof videoId === 'object' && videoId !== null) {
                idString = videoId.videoId || videoId.id?.videoId || videoId.id || '';
            } else {
                idString = videoId || '';
            }

            if (!idString || typeof idString === 'object') {
                console.error("CRITICAL ERROR: Could not resolve video ID string from:", videoId);
                alert("Error: Invalid Video ID format.");
                return;
            }

            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('youtubeIframe');

            if (iframe) {
                iframe.src = `https://www.youtube.com/embed/${idString}?autoplay=1`;
            }

            if (modal) {
                modal.style.display = 'flex';
            }

            const allKnownVideos = [
                ...currentSearchResults,
                ...JSON.parse(localStorage.getItem('savedVideos') || '[]'),
                ...JSON.parse(localStorage.getItem('watchHistory') || '[]'),
            ];
            const video = allKnownVideos.find(v => {
                const vId = typeof v.id === 'object' ? (v.id.videoId || v.id.id) : v.id;
                return vId === idString;
            });

            if (video) {
                let history = JSON.parse(localStorage.getItem('watchHistory') || '[]');
                if (!history.some(v => {
                    const hId = typeof v.id === 'object' ? (v.id.videoId || v.id.id) : v.id;
                    return hId === idString;
                })) {
                    history.unshift(video);
                    localStorage.setItem('watchHistory', JSON.stringify(history));
                    const historyCountEl = document.getElementById('historyCount');
                    if (historyCountEl) historyCountEl.textContent = history.length;
                }
            }

            // Handle Live Study Notes (loads any saved note for this video into the textarea)
            const notesArea = document.getElementById('liveNoteInput');
            if (notesArea) {
                const notesMap = JSON.parse(localStorage.getItem('videoNotes') || '{}');
                const existingEntry = notesMap[idString];
                notesArea.value = (typeof existingEntry === 'object' ? existingEntry.text : existingEntry) || '';

                notesArea.oninput = () => {
                    notesMap[idString] = {
                        text: notesArea.value,
                        title: video?.title || 'Untitled Video',
                        channel: video?.channelTitle || video?.channel || '',
                        thumbnail: video?.thumbnail || '',
                        id: idString,
                    };
                    localStorage.setItem('videoNotes', JSON.stringify(notesMap));

                    const notesCountEl = document.getElementById('notesCount');
                    if (notesCountEl) {
                        const count = Object.values(notesMap).filter(n => (typeof n === 'object' ? n.text : n)?.trim()).length;
                        notesCountEl.textContent = count;
                    }
                };
            }
        }

        // Closes the modal and stops playback (clearing src, not just hiding, so audio doesn't keep playing)
        function closePlayerModal() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('youtubeIframe');
            if (iframe) iframe.src = '';
            if (modal) modal.style.display = 'none';
        }

        function saveVideo(videoId) {
            let saved = JSON.parse(localStorage.getItem('savedVideos') || '[]');

            const alreadySavedIndex = saved.findIndex(v => {
                const vId = typeof v.id === 'object' ? (v.id.videoId || v.id.id) : v.id;
                return vId === videoId;
            });

            if (alreadySavedIndex > -1) {
                // Already saved — remove it (unsave)
                saved.splice(alreadySavedIndex, 1);
                localStorage.setItem('savedVideos', JSON.stringify(saved));
                const savedCountEl = document.getElementById('savedCount');
                if (savedCountEl) savedCountEl.textContent = saved.length;
                updateSaveButton(videoId, false);
                return;
            }

            // Not saved yet — find it and add it
            const allKnownVideos = [...currentSearchResults, ...JSON.parse(localStorage.getItem('watchHistory') || '[]')];
            const video = allKnownVideos.find(v => {
                const vId = typeof v.id === 'object' ? (v.id.videoId || v.id.id) : v.id;
                return vId === videoId;
            });
            if (!video) return;

            saved.push(video);
            localStorage.setItem('savedVideos', JSON.stringify(saved));
            const savedCountEl = document.getElementById('savedCount');
            if (savedCountEl) savedCountEl.textContent = saved.length;
            updateSaveButton(videoId, true);
        }

        // Updates a Save button's text/style to reflect current saved state
        function updateSaveButton(videoId, isSaved) {
            const btn = document.querySelector(`[data-save-id="${videoId}"]`);
            if (!btn) return;
            btn.textContent = isSaved ? 'Saved' : 'Save';
            btn.style.background = isSaved ? '#0088FF' : 'var(--bg-dark)';
            btn.style.color = isSaved ? '#fff' : 'var(--text-main)';
        }

        // Updates a Save button's text/style to reflect current saved state
        function updateSaveButton(videoId, isSaved) {
            const btn = document.querySelector(`[data-save-id="${videoId}"]`);
            if (!btn) return;
            btn.textContent = isSaved ? 'Saved ✓' : 'Save';
            btn.style.background = isSaved ? '#0088FF' : 'var(--bg-dark)';
            btn.style.color = isSaved ? '#fff' : 'var(--text-main)';
        }

        // --- Tab navigation ---
        function showSearchTab() {
            setActiveTab('tabSearch');
            const searchSection = document.getElementById('searchBoxSection');
            if (searchSection) searchSection.style.display = 'block';
            const notesSection = document.getElementById('notesSection');
            if (notesSection) notesSection.style.display = 'none';
            renderVideos(currentSearchResults, document.getElementById('videoGrid'), 'Search for a topic above!');
        }

        function showSavedTab() {
            setActiveTab('tabSaved');
            const searchSection = document.getElementById('searchBoxSection');
            if (searchSection) searchSection.style.display = 'none';
            const notesSection = document.getElementById('notesSection');
            if (notesSection) notesSection.style.display = 'none';
            const saved = JSON.parse(localStorage.getItem('savedVideos') || '[]');
            renderVideos(saved, document.getElementById('videoGrid'), 'No saved videos yet. Click "Save" on a video to see it here.');
        }

        function showHistoryTab() {
            setActiveTab('tabHistory');
            const searchSection = document.getElementById('searchBoxSection');
            if (searchSection) searchSection.style.display = 'none';
            const notesSection = document.getElementById('notesSection');
            if (notesSection) notesSection.style.display = 'none';
            const history = JSON.parse(localStorage.getItem('watchHistory') || '[]');
            renderVideos(history, document.getElementById('videoGrid'), 'No watch history yet.');
        }

        function showNotesTab() {
            setActiveTab('tabNotes');
            const searchSection = document.getElementById('searchBoxSection');
            if (searchSection) searchSection.style.display = 'none';
            const videoGrid = document.getElementById('videoGrid');
            if (videoGrid) videoGrid.innerHTML = '';
            const notesSection = document.getElementById('notesSection');
            if (notesSection) notesSection.style.display = 'block';
            renderNotesTab();
        }

        // Builds cards for each video that has a saved note, shown in the Notes tab
        function renderNotesTab() {
            const notesMap = JSON.parse(localStorage.getItem('videoNotes') || '{}');
            const grid = document.getElementById('notesGrid');
            if (!grid) return;

            const entries = Object.values(notesMap).filter(n => {
                const text = typeof n === 'object' ? n.text : n;
                return text && text.trim();
            });

            if (entries.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">No notes yet. Type something while watching a video to save it here.</p>';
                return;
            }

            grid.innerHTML = '';
            entries.forEach(entry => {
                const card = document.createElement('div');
                card.style.cssText = 'background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;';
                card.innerHTML = `
    <img src="${entry.thumbnail || ''}" alt="" style="width: 100%; aspect-ratio: 16/9; object-fit: cover;" />
    <div style="padding: 14px; display: flex; flex-direction: column; gap: 8px;">
      <h4 style="font-size: 0.9rem; color: var(--text-main); margin: 0; cursor: pointer;" onclick="openVideoModal('${entry.id}')">${entry.title}</h4>
      <span style="font-size: 0.75rem; color: var(--text-muted);">${entry.channel || ''}</span>
      <p style="font-size: 0.85rem; color: var(--text-main); white-space: pre-wrap; background: var(--bg-dark); border-radius: 8px; padding: 8px; margin-top: 4px;">${entry.text}</p>
    </div>
  `;
                grid.appendChild(card);
            });
        }

        function setActiveTab(activeId) {
            ['tabHistory', 'tabSearch', 'tabSaved', 'tabNotes'].forEach(id => {
                const btn = document.getElementById(id);
                if (!btn) return;
                if (id === activeId) {
                    btn.style.background = 'var(--accent-primary, #007bff)';
                    btn.style.color = 'white';
                    btn.style.fontWeight = '600';
                } else {
                    btn.style.background = 'transparent';
                    btn.style.color = 'var(--text-main)';
                    btn.style.fontWeight = 'normal';
                }
            });
        }

        // Auto-save handler referenced by the textarea's oninput in the HTML
        function autoSaveCurrentNote() {
            // Actual saving logic lives in openVideoModal's notesArea.oninput,
            // this just exists so the inline oninput="autoSaveCurrentNote()" doesn't error.
        }

        // Initialize saved/history/notes counts on page load
        document.addEventListener('DOMContentLoaded', () => {
            const saved = JSON.parse(localStorage.getItem('savedVideos') || '[]');
            const history = JSON.parse(localStorage.getItem('watchHistory') || '[]');
            const notesMap = JSON.parse(localStorage.getItem('videoNotes') || '{}');
            const notesCount = Object.values(notesMap).filter(n => (typeof n === 'object' ? n.text : n)?.trim()).length;

            const savedCountEl = document.getElementById('savedCount');
            const historyCountEl = document.getElementById('historyCount');
            const notesCountEl = document.getElementById('notesCount');
            if (savedCountEl) savedCountEl.textContent = saved.length;
            if (historyCountEl) historyCountEl.textContent = history.length;
            if (notesCountEl) notesCountEl.textContent = notesCount;
        });
    </script>
</body>
