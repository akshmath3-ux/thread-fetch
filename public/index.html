<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusHub Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0F17;
            --card-bg: #161B26;
            --card-hover: #1F2636;
            --accent-blue: #0088FF;
            --accent-glow: rgba(0, 136, 255, 0.25);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border-color: #262D3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header & Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38BDF8, #0088FF);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #FFF;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Search & Controls Section */
        .search-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .search-input {
            flex: 1;
            background: #0F131C;
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            color: #FFF;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .search-btn {
            background: var(--accent-blue);
            color: #FFF;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .search-btn:hover {
            box-shadow: 0 0 16px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* Filters Row */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .duration-select {
            background: #0F131C;
            color: #FFF;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        /* Preset Quick Pills */
        .preset-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .pill {
            background: #0F131C;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill:hover {
            border-color: var(--accent-blue);
            color: var(--text-main);
        }

        /* Video Feed Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: #3B82F6;
        }

        .thumb-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
        }

        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bookmark-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(11, 15, 23, 0.8);
            border: 1px solid var(--border-color);
            color: #FFF;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            font-size: 0.875rem;
            transition: background 0.2s;
            z-index: 10;
        }

        .bookmark-btn.saved {
            background: #EF4444;
            border-color: #EF4444;
        }

        .video-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            flex: 1;
            background: #0F131C;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--border-color);
        }

        /* Summary Modal Drawer */
        .summary-box {
            background: #0F131C;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
            display: none;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
        }

        /* Next Topics Drawer */
        .next-topics {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            display: none;
        }

        .next-topics h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .topic-pills {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        /* Video Player Overlay Modal */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .player-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1010;
            background: rgba(15, 19, 28, 0.9);
            border: 1px solid var(--border-color);
            color: #FFF;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Mobile Responsive Styles --- */
        @media (max-width: 768px) {

            /* Stack the video player and notes vertically on mobile */
            #playerModal>div>div[style*="display: flex"] {
                flex-direction: column !important;
                overflow-y: auto;
            }

            /* Adjust video frame for mobile screens */
            #playerModal iframe {
                min-height: 250px !important;
                height: 30vh !important;
            }

            /* Make the notes panel take the remaining space */
            #liveNoteInput {
                min-height: 40vh !important;
            }

            /* Adjust navigation tabs to fit small screens */
            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem;
            }

            .tab-btn {
                font-size: 0.85rem;
                padding: 0.5rem 0.8rem;
                flex: 1 1 auto;
                text-align: center;
            }

            /* Adjust main container padding */
            .container {
                padding: 10px !important;
            }

            /* Adjust the search box layout for mobile */
            #searchBoxSection>div {
                flex-direction: column !important;
                align-items: stretch !important;
            }

            #searchBoxSection button,
            #searchBoxSection input {
                width: 100%;
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>
    <!-- Pomodoro Timer Container -->
    <!-- Minimized Timer Bar with Breaks -->
    <div
        style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span
                style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Focus
                Timer</span>
            <span id="minimizedTimerDisplay"
                style="font-size: 1.15rem; font-weight: 700; color: var(--text-main); font-family: monospace;">25:00</span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; flex-wrap: wrap;">
            <button onclick="setTimer(15)"
                style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 3px 7px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;">15m</button>
            <button onclick="setTimer(25)"
                style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 3px 7px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;">25m</button>
            <button onclick="setTimer(45)"
                style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 3px 7px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;">45m</button>
            <button id="startPauseBtn" onclick="toggleTimer()"
                style="background: var(--accent-primary, #007bff); border: none; color: white; padding: 3px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; cursor: pointer;">Start</button>
            <button onclick="resetTimer()"
                style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-muted); padding: 3px 7px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;">Reset</button>
            <button onclick="setTimer(5)"
                style="background: #198754; border: none; color: white; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;">Short
                Break (5m)</button>
            <button onclick="setTimer(15)"
                style="background: #198754; border: none; color: white; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;">Long
                Break (15m)</button>
        </div>
    </div>

    <!-- Systematic Navigation Bar -->
    <div class="nav-tabs"
        style="display: flex; justify-content: center; align-items: center; gap: 6px; background: var(--bg-card); padding: 6px; border-radius: 12px; border: 1px solid var(--border-color);">
        <button class="tab-btn" id="tabHistory" onclick="showHistoryTab()"
            style="flex: 1; text-align: center; padding: 7px 10px; border-radius: 8px; border: none; background: transparent; color: var(--text-main); cursor: pointer; font-size: 0.85rem;">History
            (<span id="historyCount">0</span>)</button>
        <button class="tab-btn active" id="tabSearch" onclick="showSearchTab()"
            style="flex: 1; text-align: center; padding: 7px 10px; border-radius: 8px; border: none; background: var(--accent-primary, #007bff); color: white; cursor: pointer; font-size: 0.85rem; font-weight: 600;">Search
            Feed</button>
        <button class="tab-btn" id="tabSaved" onclick="showSavedTab()"
            style="flex: 1; text-align: center; padding: 7px 10px; border-radius: 8px; border: none; background: transparent; color: var(--text-main); cursor: pointer; font-size: 0.85rem;">Saved
            (<span id="savedCount">0</span>)</button>
        <button class="tab-btn" id="tabNotes" onclick="showNotesTab()"
            style="flex: 1; text-align: center; padding: 7px 10px; border-radius: 8px; border: none; background: transparent; color: var(--text-main); cursor: pointer; font-size: 0.85rem;">Notes
            (<span id="notesCount">0</span>)</button>
    </div>

    </div>

    <!-- Search Controls -->
    <!-- Search Box Section -->
    <div id="searchBoxSection" style="max-width: 800px; margin: 20px auto; padding: 0 15px;">
        <div
            style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px;">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="searchInput"
                    placeholder="What do you want to learn today? (e.g. Design, Python, Calculus)"
                    style="flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; outline: none;" />
                <button onclick="executeSearch()"
                    style="background: var(--accent-primary, #007bff); border: none; color: white; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem;">Search</button>
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;" id="presetPills">
                <button onclick="handlePresetClick('Design')"
                    style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer;">🎨
                    Design</button>
                <button onclick="handlePresetClick('Gaming')"
                    style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer;">🎮
                    Gaming</button>
                <button onclick="handlePresetClick('Coding')"
                    style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer;">💻
                    Coding</button>
                <button onclick="handlePresetClick('Science')"
                    style="background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer;">🔬
                    Science</button>
            </div>
        </div>
    </div>
    <!-- Search Results / Video Feed Container -->
    <div id="searchResults"
        style="max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    </div>
    <!-- Video Grid -->
    <div class="video-grid" id="videoGrid"></div>

    <!-- Smart Related Topic Pills -->
    <div class="next-topics" id="nextTopicsSection">
        <h3>🚀 Where to Next? Suggested Follow-up Topics:</h3>
        <div class="topic-pills" id="topicPills"></div>
    </div>
    </div>

    <!-- In-Page Video Player Modal -->
    <!-- Video Player Modal with Integrated Study Notes -->
    <div class="player-modal" id="playerModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 2rem;">
        <div
            style="background: var(--bg-card); width: 100%; max-width: 1100px; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;">

            <!-- Modal Header -->
            <div
                style="padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
                <h3 id="modalVideoTitle"
                    style="color: var(--text-main); font-size: 1.1rem; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%;">
                    Study Session</h3>
                <button onclick="closePlayerModal()"
                    style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>

            <!-- Modal Body: Video + Live Notes Split View -->
            <div style="display: flex; flex-wrap: wrap; flex: 1; overflow: hidden;">

                <!-- Left Side: Video Frame -->
                <div
                    style="flex: 1.5; min-width: 320px; background: #000; display: flex; align-items: center; justify-content: center; position: relative;">
                    <iframe id="youtubeIframe" style="width: 100%; height: 100%; min-height: 350px; border: none;"
                        allowfullscreen></iframe>
                </div>

                <!-- Right Side: Live Study Notes Panel -->
                <div
                    style="flex: 1; min-width: 280px; display: flex; flex-direction: column; background: var(--bg-dark); border-left: 1px solid var(--border-color); padding: 1rem;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Live Study
                            Notes</label>
                        <span id="noteSaveStatus"
                            style="font-size: 0.75rem; color: var(--text-muted);">Auto-saved</span>
                    </div>
                    <textarea id="liveNoteInput"
                        placeholder="Type key takeaways, formulas, or code snippets here while you watch..."
                        oninput="autoSaveCurrentNote()"
                        style="flex: 1; width: 100%; min-height: 200px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.75rem; resize: none; font-family: inherit; font-size: 0.9rem;"></textarea>
                </div>

            </div>
        </div>
    </div>
    <!-- Study Notes Archive Section -->
    <div id="notesSection" class="tab-section" style="display: none;">
        <h2 style="margin-bottom: 1rem; color: var(--text-main);">My Stored Study Notes</h2>
        <div id="notesGrid"
            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
            <!-- Rendered dynamically -->
        </div>
    </div>
    <script>
        function handlePresetClick(topic) {
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = topic;
            }
            if (typeof executeSearch === 'function') {
                executeSearch();
            } else if (typeof searchPreset === 'function') {
                searchPreset(topic);
            }
        }
        // --- Global State ---
        let currentTab = 'search';
        let timerInterval = null;
        let timeLeft = 25 * 60;
        let isRunning = false;

        // --- Timer Logic ---
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const displayStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            const timerEl = document.getElementById('minimizedTimerDisplay');
            if (timerEl) timerEl.innerText = displayStr;
        }

        function setTimer(mins) {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = mins * 60;
            updateTimerDisplay();
            const startBtn = document.getElementById('startPauseBtn');
            if (startBtn) startBtn.innerText = 'Start';
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startPauseBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                if (startBtn) startBtn.innerText = 'Start';
            } else {
                isRunning = true;
                if (startBtn) startBtn.innerText = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        if (startBtn) startBtn.innerText = 'Start';
                        alert('Focus session completed! Take a break.');
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = 25 * 60;
            updateTimerDisplay();
            const startBtn = document.getElementById('startPauseBtn');
            if (startBtn) startBtn.innerText = 'Start';
        }

        // --- Counts Updater ---
        function updateCounts() {
            const historyCountEl = document.getElementById('historyCount');
            const savedCountEl = document.getElementById('savedCount');
            const notesCountEl = document.getElementById('notesCount');

            if (historyCountEl && typeof watchedVideos !== 'undefined') {
                historyCountEl.innerText = watchedVideos.length;
            }
            if (savedCountEl && typeof savedVideos !== 'undefined') {
                savedCountEl.innerText = savedVideos.length;
            }
            if (notesCountEl && typeof activeNotes !== 'undefined') {
                notesCountEl.innerText = activeNotes.length;
            }
        }

        // --- Tab Switching Logic ---
        function hideAllSections() {
            const searchBox = document.getElementById('searchBoxSection');
            const feedSec = document.getElementById('feedSection') || document.getElementById('searchResults');
            const historySec = document.getElementById('historySection');
            const savedSec = document.getElementById('savedSection');
            const notesSec = document.getElementById('notesSection');

            if (searchBox) searchBox.style.display = 'none';
            if (feedSec) feedSec.style.display = 'none';
            if (historySec) historySec.style.display = 'none';
            if (savedSec) savedSec.style.display = 'none';
            if (notesSec) notesSec.style.display = 'none';

            ['tabHistory', 'tabSearch', 'tabSaved', 'tabNotes'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.classList.remove('active');
                    btn.style.background = 'transparent';
                    btn.style.color = 'var(--text-main)';
                    btn.style.fontWeight = 'normal';
                }
            });
        }

        function setActiveButton(btnId) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.add('active');
                btn.style.background = 'var(--accent-primary, #007bff)';
                btn.style.color = 'white';
                btn.style.fontWeight = '600';
            }
        }

        function showSearchTab() {
            hideAllSections();
            setActiveButton('tabSearch');
            currentTab = 'search';

            const searchBox = document.getElementById('searchBoxSection');
            const feedSec = document.getElementById('feedSection') || document.getElementById('searchResults');

            if (searchBox) searchBox.style.display = 'block';
            if (feedSec) feedSec.style.display = 'block';
            if (typeof renderVideos === 'function' && typeof currentSearchResults !== 'undefined') {
                renderVideos(currentSearchResults);
            }
            updateCounts();
        }

        function showHistoryTab() {
            hideAllSections();
            setActiveButton('tabHistory');
            currentTab = 'history';

            const historySec = document.getElementById('historySection');
            if (historySec) historySec.style.display = 'block';
            if (typeof renderHistory === 'function') renderHistory();
            updateCounts();
        }

        function showSavedTab() {
            hideAllSections();
            setActiveButton('tabSaved');
            currentTab = 'saved';

            const savedSec = document.getElementById('savedSection');
            if (savedSec) savedSec.style.display = 'block';
            if (typeof renderSaved === 'function') renderSaved();
            updateCounts();
        }

        function showNotesTab() {
            hideAllSections();
            setActiveButton('tabNotes');
            currentTab = 'notes';

            const notesSec = document.getElementById('notesSection');
            if (notesSec) notesSec.style.display = 'block';
            if (typeof renderNotesArchive === 'function') renderNotesArchive();
            updateCounts();
        }

        // Initial count check on load
        window.addEventListener('DOMContentLoaded', () => {
            updateCounts();
            updateTimerDisplay();
        });
    </script>
</body>

</html>
